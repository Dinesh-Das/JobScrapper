handlers= java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# FileHandler settings (detailed logs for debugging)
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = application.log
java.util.logging.FileHandler.limit = 5000000
java.util.logging.FileHandler.count = 1
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# ConsoleHandler settings (only important messages)
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Root logger settings
.level = INFO

# Application loggers - INFO for console, ALL for file
org.dinesh.database.DatabaseHandler.level = INFO
org.dinesh.database.BatchDatabaseHandler.level = INFO
org.dinesh.scrapper.OptimizedNaukriScraper.level = INFO
Main.level = INFO

# Suppress Selenium warnings
org.openqa.selenium.level = SEVERE
